<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6FDB"/>
      <stop offset="1" stop-color="#1D4FA8"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E9F2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B2350" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- map tiles behind the robot -->
  <g opacity="0.22" fill="#FFFFFF">
    <rect x="64" y="300" width="120" height="96" rx="14"/>
    <rect x="196" y="340" width="96" height="104" rx="14"/>
    <rect x="304" y="316" width="144" height="80" rx="14"/>
    <rect x="72" y="78" width="104" height="88" rx="14"/>
    <rect x="344" y="70" width="96" height="112" rx="14"/>
  </g>
  <!-- cleaning path -->
  <path d="M120 420 C 120 330, 392 330, 392 250" fill="none" stroke="#FFD25A" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 26"/>
  <!-- robot -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="226" r="140" fill="url(#body)"/>
  </g>
  <circle cx="256" cy="226" r="140" fill="none" stroke="#C9D3E3" stroke-width="6"/>
  <path d="M146 160 A 128 128 0 0 1 366 160" fill="none" stroke="#C9D3E3" stroke-width="10" stroke-linecap="round"/>
  <!-- lidar dome -->
  <circle cx="256" cy="200" r="46" fill="#24324A"/>
  <circle cx="256" cy="200" r="28" fill="#2F6FDB"/>
  <circle cx="246" cy="190" r="9" fill="#9CC0FF"/>
  <!-- status light -->
  <rect x="224" y="292" width="64" height="12" rx="6" fill="#3FA34D"/>
</svg>
