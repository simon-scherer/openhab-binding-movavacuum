thing-type.config.movavacuum.account.accountType.description = Marke der App, mit der das Konto angelegt wurde (Mova-App = mova, Dreamehome-App = dreame).
thing-type.config.movavacuum.account.accountType.option.mova = Mova
thing-type.config.movavacuum.account.accountType.option.dreame = Dreame
thing-type.config.movavacuum.account.accountType.option.trouver = Trouver
thing-type.config.movavacuum.account.country.label = Region
thing-type.config.movavacuum.account.country.description = Cloud-Region des Kontos. Mova: eu, cn, us, sg, kr. Dreame: eu, cn, us, ru, sg, kr, by. Trouver: eu, us, ru, sg. Wenn der Login oder die Ger\u00e4teliste leer bleibt, andere Region probieren.
thing-type.config.movavacuum.account.country.option.eu = eu (Europa)
thing-type.config.movavacuum.account.country.option.us = us
thing-type.config.movavacuum.account.country.option.cn = cn
thing-type.config.movavacuum.account.country.option.sg = sg
thing-type.config.movavacuum.account.country.option.ru = ru
thing-type.config.movavacuum.account.country.option.kr = kr
thing-type.config.movavacuum.account.country.option.by = by
thing-type.config.movavacuum.account.pollingInterval.label = Abfrage-Intervall
thing-type.config.movavacuum.account.pollingInterval.description = Wie oft (in Sekunden) der Zustand des Saugers abgefragt wird.
thing-type.movavacuum.vacuum.label = Mova/Dreame Saugroboter
thing-type.movavacuum.vacuum.description = Ein einzelner Mova/Dreame Saugroboter (z.B. Mova V50 Ultra), verbunden \u00fcber die Account-Bridge.
thing-type.config.movavacuum.vacuum.did.label = Ger\u00e4te-ID (did)
thing-type.config.movavacuum.vacuum.did.description = Die Ger\u00e4te-ID (did) des Saugers. Sie steht im openHAB-Log, sobald die Account-Bridge online ist (Zeile "Mova/Dreame-Ger\u00e4t gefunden").
thing-type.config.movavacuum.vacuum.settingsInterval.label = Abfrage-Intervall Einstellungen
thing-type.config.movavacuum.vacuum.settingsInterval.description = Wie oft (in Sekunden, mindestens 10) die Teppich-/Boden-Einstellungen abgefragt werden, damit \u00c4nderungen aus der App schnell in openHAB ankommen.
thing-type.config.movavacuum.vacuum.mapKey.label = Karten-Schl\u00fcssel (IV)
thing-type.config.movavacuum.vacuum.mapKey.description = Optional: 16 Zeichen langer Anfangswert f\u00fcr die Kartenentschl\u00fcsselung. Leer lassen, wenn das Modell bekannt ist.
thing-type.config.movavacuum.vacuum.mapRotation.label = Karte drehen
thing-type.config.movavacuum.vacuum.mapRotation.description = Drehung des Kartenbilds im Uhrzeigersinn: -1 = automatisch (Wert der Karte), sonst 0, 90, 180 oder 270 Grad.
thing-type.config.movavacuum.vacuum.mapRotation.option.-1 = Automatisch
thing-type.config.movavacuum.vacuum.mapRotation.option.0 = 0 Grad
thing-type.config.movavacuum.vacuum.mapRotation.option.90 = 90 Grad
thing-type.config.movavacuum.vacuum.mapRotation.option.180 = 180 Grad
thing-type.config.movavacuum.vacuum.mapRotation.option.270 = 270 Grad
thing-type.config.movavacuum.vacuum.mapFlip.label = Karte spiegeln
thing-type.config.movavacuum.vacuum.mapFlip.description = Spiegelt das Kartenbild von oben nach unten (vor dem Drehen). Standard: an, dann sieht die Karte aus wie in der App.
thing-type.config.movavacuum.vacuum.showHiddenRooms.label = Ausgeblendete R\u00e4ume anzeigen
thing-type.config.movavacuum.vacuum.showHiddenRooms.description = Aus (Standard): In der App ausgeblendete R\u00e4ume erscheinen nicht im Kartenbild, wie in der App. An: Sie werden grau gezeichnet.
thing-type.config.movavacuum.vacuum.mapSize.label = Karten-Bildgr\u00f6\u00dfe
thing-type.config.movavacuum.vacuum.mapSize.description = Angestrebte Kantenl\u00e4nge des Kartenbilds in Pixeln (Standard 600). Kleinere Werte machen das Bild kleiner.
thing-type.config.movavacuum.vacuum.mapLabels.label = Beschriftung der Karte
thing-type.config.movavacuum.vacuum.mapLabels.description = Was im Kartenbild in jedem Raum steht: Raumname (wie in der App), Nummer oder beides.
thing-type.config.movavacuum.vacuum.mapLabels.option.name = Raumname
thing-type.config.movavacuum.vacuum.mapLabels.option.number = Nummer
thing-type.config.movavacuum.vacuum.mapLabels.option.both = Nummer und Name
