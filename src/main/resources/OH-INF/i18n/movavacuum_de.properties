channel-type.movavacuum.cleangenius-mode-channel.description = Modus von CleanGenius: vacuum_and_mop oder mop_after_vacuum.
channel-type.movavacuum.cleangenius-mode-channel.state.option.vacuum_and_mop = Saugen und Wischen
channel-type.movavacuum.cleangenius-mode-channel.state.option.mop_after_vacuum = Erst Saugen, dann Wischen
channel-type.movavacuum.room-settings-channel.label = Raum-Einstellungen \u00e4ndern
