channel-type.movavacuum.clean-rooms-channel.description = R\u00e4ume durch Komma getrennt, Nummer oder Name (z. B. 1,2 oder K\u00fcche@times=2/suction=strong/water=3). Ohne Optionen: aktuelle Saug- und Wasserstufe, einmal. Option room nimmt die in der App gespeicherten Raum-Einstellungen.
channel-type.movavacuum.clean-zone-channel.label = Zonen reinigen
channel-type.movavacuum.clean-zone-channel.description = Zonen als x1,y1,x2,y2 in Karteneinheiten (mm), mehrere mit Semikolon getrennt, optional mit Optionen, z. B. -1000,-500,2000,1500@times=2/suction=strong/water=2. Ohne Optionen: aktuelle Saug- und Wasserstufe, einmal.
