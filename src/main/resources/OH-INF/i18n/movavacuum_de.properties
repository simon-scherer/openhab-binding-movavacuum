channel-type.movavacuum.cleangenius-channel.description = KI-gesteuerte Reinigung: off, routine_cleaning, deep_cleaning (nur bei eingesetztem Mopp-Pad wirksam).
channel-type.movavacuum.cleangenius-channel.state.option.off = Aus
channel-type.movavacuum.cleangenius-channel.state.option.routine_cleaning = Routinereinigung
channel-type.movavacuum.cleangenius-channel.state.option.deep_cleaning = Tiefenreinigung
