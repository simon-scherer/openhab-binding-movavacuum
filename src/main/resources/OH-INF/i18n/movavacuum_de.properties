channel-type.movavacuum.error-text-channel.label = Fehlertext
channel-type.movavacuum.error-text-channel.description = Klartext zum aktuellen Fehlercode (nur lesen).
channel-type.movavacuum.last-cleaning-channel.label = Letzte Reinigung
channel-type.movavacuum.last-cleaning-channel.description = Eine Zeile zur letzten Reinigung: Start, Dauer, Fl\u00e4che, Ergebnis (nur lesen).
channel-type.movavacuum.cleaning-history-channel.label = Reinigungsverlauf
channel-type.movavacuum.cleaning-history-channel.description = Die letzten 10 Reinigungen, eine Zeile je Lauf, neueste zuerst (nur lesen).
channel-type.movavacuum.clean-spot-channel.label = Punkte reinigen
channel-type.movavacuum.clean-spot-channel.description = Punkte als x,y in Karteneinheiten (mm), mehrere mit Semikolon getrennt, optional mit Optionen, z. B. 700,-1500@times=2/suction=quiet/water=2. Gereinigt wird ca. 1,5 m\u00b2 um den Punkt.
channel-type.movavacuum.room-zones-channel.label = Raum-Koordinaten
channel-type.movavacuum.room-zones-channel.description = Eine Zeile je Raum: umschlie\u00dfendes Rechteck (Zone x1,y1,x2,y2) und ein sicher befahrbarer Punkt nahe der Raummitte in Karteneinheiten (mm), nur lesen. Zur Verwendung mit Zonen- und Punktreinigung.
channel-type.movavacuum.robot-position-channel.label = Roboter-Position
channel-type.movavacuum.robot-position-channel.description = Position des Roboters (x,y in mm) mit Raum, Station und Zeitstempel der letzten Karte (nur lesen). W\u00e4hrend Reinigung und R\u00fcckfahrt wird die Karte jede Minute neu geladen.
channel-type.movavacuum.go-to-channel.label = Zu Punkt fahren
channel-type.movavacuum.go-to-channel.description = Zielpunkt als x,y in Karteneinheiten (mm). Der Roboter f\u00e4hrt hin und bleibt dort stehen (nur auf Modellen mit Kamera).
channel-type.movavacuum.remote-control-channel.label = Fernsteuerung
channel-type.movavacuum.remote-control-channel.description = Ein Schritt: forward, backward, left, right, stop oder Drehung,Geschwindigkeit (Drehung -360..360, Geschwindigkeit -600..600).
channel-type.movavacuum.shortcuts-channel.label = Shortcuts
channel-type.movavacuum.shortcuts-channel.description = Eine Zeile je Shortcut: Nummer, Name und ggf. "l\u00e4uft" (nur lesen).
channel-type.movavacuum.shortcut-channel.label = Shortcut-Befehl
channel-type.movavacuum.shortcut-channel.description = start:Nummer oder Name (ohne Pr\u00e4fix wird gestartet), rename:Nummer=Neuer Name oder delete:Nummer.
channel-type.movavacuum.room-edit-channel.label = R\u00e4ume bearbeiten
channel-type.movavacuum.room-edit-channel.description = Raum@Option, mehrere R\u00e4ume mit Semikolon getrennt, Optionen mit Schr\u00e4gstrich: name=Neuer Name, visible=on|off, floor=none|wood|tile, mop=A|B|C. Beispiel: Technikraum@name=Haustechnik/floor=tile. Nicht w\u00e4hrend einer Reinigung.
channel-type.movavacuum.map-command-channel.label = Karten-Befehl
channel-type.movavacuum.map-command-channel.description = rename:Neuer Name (aktuelle Karte umbenennen) oder backup (aktuelle Karte in der Cloud sichern). Nicht w\u00e4hrend einer Reinigung.
channel-type.movavacuum.room-progress-channel.label = Reinigungsfortschritt je Raum
channel-type.movavacuum.room-progress-channel.description = Erledigte, \u00fcbersprungene und offene R\u00e4ume des laufenden Auftrags (nur lesen).
channel-type.movavacuum.current-room-channel.label = Aktueller Raum
channel-type.movavacuum.current-room-channel.description = Raum, in dem sich der Roboter laut letzter Karte befindet (nur lesen).
channel-type.movavacuum.obstacles-channel.label = Erkannte Hindernisse
channel-type.movavacuum.obstacles-channel.description = Eine Zeile je Hindernis: Nummer, Art, Position (mm), ggf. ignoriert (nur lesen).
channel-type.movavacuum.obstacle-ignore-channel.label = Hindernis ignorieren
channel-type.movavacuum.obstacle-ignore-channel.description = Nummer=ignore oder Nummer=restore (Nummer aus dem Channel Erkannte Hindernisse). Nicht w\u00e4hrend einer Reinigung.
channel-type.movavacuum.room-info-channel.label = Raum-Einstellungen
channel-type.movavacuum.room-info-channel.description = Eine Zeile je Raum: Modus, Saugstufe, Wasser, Wiederholungen, Reihenfolge, letzte Reinigung (nur lesen).
channel-type.movavacuum.map-image-channel.label = Karte
channel-type.movavacuum.map-image-channel.description = Gezeichnete Karte als PNG im hellen Design (wie in der App, transparenter Hintergrund).
channel-type.movavacuum.map-image-dark-channel.label = Karte (dunkel)
channel-type.movavacuum.map-image-dark-channel.description = Gezeichnete Karte als PNG im dunklen Design. Wird nur gezeichnet, wenn ein Item verkn\u00fcpft ist.
