# add-on

addon.movavacuum.name = Mova/Dreame Vacuum Binding
addon.movavacuum.description = Unofficial binding for Mova/Dreame robot vacuums (DreameHome/Mova cloud), e.g. Mova V50 Ultra.
thing-type.movavacuum.account.label = Mova/Dreame Account
thing-type.movavacuum.account.description = Cloud account connection to the DreameHome/Mova cloud. After login, the device ID (did) is written to the openHAB log.
thing-type.config.movavacuum.account.username.label = Username
thing-type.config.movavacuum.account.username.description = E-mail address of your Mova/Dreamehome account.
thing-type.config.movavacuum.account.password.label = Password
thing-type.config.movavacuum.account.password.description = Password of your Mova/Dreamehome account.
thing-type.config.movavacuum.account.accountType.label = Account Type
thing-type.config.movavacuum.account.accountType.description = Brand of the app the account was created with (Mova app = mova, Dreamehome app = dreame).
thing-type.config.movavacuum.account.accountType.option.mova = Mova
thing-type.config.movavacuum.account.accountType.option.dreame = Dreame
thing-type.config.movavacuum.account.accountType.option.trouver = Trouver
thing-type.config.movavacuum.account.country.label = Region
thing-type.config.movavacuum.account.country.description = Cloud region of the account. Mova: eu, cn, us, sg, kr. Dreame: eu, cn, us, ru, sg, kr, by. Trouver: eu, us, ru, sg. If the login fails or the device list stays empty, try another region.
thing-type.config.movavacuum.account.country.option.eu = eu (Europe)
thing-type.config.movavacuum.account.country.option.us = us
thing-type.config.movavacuum.account.country.option.cn = cn
thing-type.config.movavacuum.account.country.option.sg = sg
thing-type.config.movavacuum.account.country.option.ru = ru
thing-type.config.movavacuum.account.country.option.kr = kr
thing-type.config.movavacuum.account.country.option.by = by
thing-type.config.movavacuum.account.pollingInterval.label = Polling Interval
thing-type.config.movavacuum.account.pollingInterval.description = How often (in seconds) the state of the vacuum is polled.
thing-type.movavacuum.vacuum.label = Mova/Dreame Robot Vacuum
thing-type.movavacuum.vacuum.description = A single Mova/Dreame robot vacuum (e.g. Mova V50 Ultra), connected via the account bridge.
thing-type.config.movavacuum.vacuum.did.label = Device ID (did)
thing-type.config.movavacuum.vacuum.did.description = The device ID (did) of the vacuum. It is written to the openHAB log as soon as the account bridge is online (line "Mova/Dreame device found").
thing-type.config.movavacuum.vacuum.settingsInterval.label = Settings Polling Interval
thing-type.config.movavacuum.vacuum.settingsInterval.description = How often (in seconds, at least 10) the settings are polled so that changes made in the app show up in openHAB quickly.
thing-type.config.movavacuum.vacuum.mapKey.label = Map Key (IV)
thing-type.config.movavacuum.vacuum.mapKey.description = Optional: 16 character initialization vector for map decryption. Leave empty if the model is known.
thing-type.config.movavacuum.vacuum.mapRotation.label = Rotate Map
thing-type.config.movavacuum.vacuum.mapRotation.description = Clockwise rotation of the map image: -1 = automatic (value stored in the map), otherwise 0, 90, 180 or 270 degrees.
thing-type.config.movavacuum.vacuum.mapRotation.option.-1 = Automatic
thing-type.config.movavacuum.vacuum.mapRotation.option.0 = 0 degrees
thing-type.config.movavacuum.vacuum.mapRotation.option.90 = 90 degrees
thing-type.config.movavacuum.vacuum.mapRotation.option.180 = 180 degrees
thing-type.config.movavacuum.vacuum.mapRotation.option.270 = 270 degrees
thing-type.config.movavacuum.vacuum.mapFlip.label = Flip Map
thing-type.config.movavacuum.vacuum.mapFlip.description = Flips the map image vertically (before rotating). Default: on, so the map looks like in the app.
thing-type.config.movavacuum.vacuum.showHiddenRooms.label = Show Hidden Rooms
thing-type.config.movavacuum.vacuum.showHiddenRooms.description = Off (default): rooms hidden in the app are not drawn, like in the app. On: they are drawn in grey.
thing-type.config.movavacuum.vacuum.mapSize.label = Map Image Size
thing-type.config.movavacuum.vacuum.mapSize.description = Target edge length of the map image in pixels (default 600).
thing-type.config.movavacuum.vacuum.mapLabels.label = Map Labels
thing-type.config.movavacuum.vacuum.mapLabels.description = What is written into each room of the map image: room name (as in the app), number or both.
thing-type.config.movavacuum.vacuum.mapLabels.option.name = Room name
thing-type.config.movavacuum.vacuum.mapLabels.option.number = Number
thing-type.config.movavacuum.vacuum.mapLabels.option.both = Number and name
channel-type.movavacuum.state-channel.label = State
channel-type.movavacuum.state-channel.description = Overall state of the vacuum (sweeping, idle, paused, error, returning, charging, mopping, ...).
channel-type.movavacuum.status-channel.label = Status Code
channel-type.movavacuum.status-channel.description = Raw status property value (siid 4 / piid 1) for diagnostics.
channel-type.movavacuum.battery-channel.label = Battery Level
channel-type.movavacuum.charging-channel.label = Charging
channel-type.movavacuum.error-channel.label = Error Code
channel-type.movavacuum.error-channel.description = 0 = no error. Values as in DreameVacuumErrorCode of the Tasshack reference implementation.
channel-type.movavacuum.command-channel.label = Command
channel-type.movavacuum.command-channel.description = Send: start, pause, stop, dock, locate. start also resumes a paused mop washing or return to the station.
channel-type.movavacuum.command-channel.command.option.start = Start
channel-type.movavacuum.command-channel.command.option.pause = Pause
channel-type.movavacuum.command-channel.command.option.stop = Stop
channel-type.movavacuum.command-channel.command.option.dock = Dock
channel-type.movavacuum.command-channel.command.option.locate = Locate
channel-type.movavacuum.suction-channel.label = Suction Level
channel-type.movavacuum.suction-channel.description = Suction level: quiet, standard, strong, turbo.
channel-type.movavacuum.suction-channel.state.option.quiet = Quiet
channel-type.movavacuum.suction-channel.state.option.standard = Standard
channel-type.movavacuum.suction-channel.state.option.strong = Strong
channel-type.movavacuum.suction-channel.state.option.turbo = Turbo
channel-type.movavacuum.volume-channel.label = Volume
channel-type.movavacuum.volume-channel.description = Voice volume in percent (0 to 100).
channel-type.movavacuum.dnd-channel.label = Do Not Disturb
channel-type.movavacuum.dnd-channel.description = Do not disturb is active (read only).
channel-type.movavacuum.cleaning-mode-raw-channel.label = Cleaning Mode (raw)
channel-type.movavacuum.cleaning-mode-raw-channel.description = Raw packed value (siid 4 / piid 23) for diagnostics.
channel-type.movavacuum.water-raw-channel.label = Water Level (raw)
channel-type.movavacuum.water-raw-channel.description = Raw value (siid 4 / piid 5) for diagnostics.
channel-type.movavacuum.cleaning-time-channel.label = Cleaning Time
channel-type.movavacuum.cleaning-time-channel.description = Duration of the current/last cleaning.
channel-type.movavacuum.cleaned-area-channel.label = Cleaned Area
channel-type.movavacuum.cleaned-area-channel.description = Area of the current/last cleaning.
channel-type.movavacuum.total-cleaning-time-channel.label = Total Cleaning Time
channel-type.movavacuum.total-cleaned-area-channel.label = Total Cleaned Area
channel-type.movavacuum.cleaning-count-channel.label = Cleaning Count
channel-type.movavacuum.consumable-channel.label = Consumable Left
channel-type.movavacuum.consumable-channel.description = Remaining lifetime in percent (updated every few minutes).
channel-type.movavacuum.consumable-time-channel.label = Time Left
channel-type.movavacuum.consumable-time-channel.description = Remaining time in hours (updated every few minutes).
channel-type.movavacuum.setting-switch-channel.label = Setting (Switch)
channel-type.movavacuum.setting-switch-channel.description = On/off setting of the vacuum (read and write). Stays empty if the device does not support it.
channel-type.movavacuum.carpet-cleaning-channel.label = Carpet Cleaning
channel-type.movavacuum.carpet-cleaning-channel.description = Behaviour on carpets.
channel-type.movavacuum.carpet-cleaning-channel.state.option.avoidance = Avoid
channel-type.movavacuum.carpet-cleaning-channel.state.option.adaptation = Vacuum (lift mop pads)
channel-type.movavacuum.carpet-cleaning-channel.state.option.remove_mop = Vacuum, remove mop pads (depending on model)
channel-type.movavacuum.carpet-cleaning-channel.state.option.adaptation_without_route = Vacuum without route
channel-type.movavacuum.carpet-cleaning-channel.state.option.vacuum_and_mop = Vacuum and mop
channel-type.movavacuum.carpet-cleaning-channel.state.option.cross = Cross carpets
channel-type.movavacuum.carpet-cleaning-channel.state.option.ignore = Ignore
channel-type.movavacuum.auto-lds-channel.label = Auto Lift LDS
channel-type.movavacuum.auto-lds-channel.state.option.off = Off
channel-type.movavacuum.auto-lds-channel.state.option.security = Safe coverage
channel-type.movavacuum.auto-lds-channel.state.option.extreme = Extreme coverage
channel-type.movavacuum.mop-extend-frequency-channel.label = Mop Extend Frequency
channel-type.movavacuum.mop-extend-frequency-channel.state.option.standard = Standard
channel-type.movavacuum.mop-extend-frequency-channel.state.option.intelligent = Intelligent (AI)
channel-type.movavacuum.mop-extend-frequency-channel.state.option.high = High
channel-type.movavacuum.auto-empty-mode-channel.label = Auto Empty
channel-type.movavacuum.auto-empty-mode-channel.state.option.off = Off
channel-type.movavacuum.auto-empty-mode-channel.state.option.standard = Standard
channel-type.movavacuum.auto-empty-mode-channel.state.option.intelligent = Intelligent
channel-type.movavacuum.auto-empty-mode-channel.state.option.low_frequency = Low frequency
channel-type.movavacuum.auto-empty-mode-channel.state.option.custom_frequency = Custom frequency
channel-type.movavacuum.auto-empty-mode-channel.state.option.high_frequency = High frequency
channel-type.movavacuum.mop-wash-level-channel.label = Mop Wash Level
channel-type.movavacuum.mop-wash-level-channel.state.option.water_saving = Water saving
channel-type.movavacuum.mop-wash-level-channel.state.option.daily = Daily
channel-type.movavacuum.mop-wash-level-channel.state.option.deep = Deep
