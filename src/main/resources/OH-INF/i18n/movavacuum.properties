channel-type.movavacuum.scraper-frequency-channel.state.option.off = Off
channel-type.movavacuum.scraper-frequency-channel.state.option.weekly = Weekly
channel-type.movavacuum.scraper-frequency-channel.state.option.daily = Daily
channel-type.movavacuum.water-temperature-channel.label = Water Temperature
channel-type.movavacuum.water-temperature-channel.state.option.normal = Normal
channel-type.movavacuum.water-temperature-channel.state.option.mild = Mild
channel-type.movavacuum.water-temperature-channel.state.option.warm = Warm
channel-type.movavacuum.water-temperature-channel.state.option.hot = Hot
channel-type.movavacuum.water-temperature-channel.state.option.max = Maximum
channel-type.movavacuum.self-clean-frequency-channel.label = Self-Clean Frequency
channel-type.movavacuum.self-clean-frequency-channel.state.option.by_area = By area
channel-type.movavacuum.self-clean-frequency-channel.state.option.by_time = By time
channel-type.movavacuum.self-clean-frequency-channel.state.option.by_room = By room
channel-type.movavacuum.self-clean-frequency-channel.state.option.intelligent = Intelligent
channel-type.movavacuum.mopping-type-channel.label = Mopping Type
channel-type.movavacuum.mopping-type-channel.state.option.daily = Daily
channel-type.movavacuum.mopping-type-channel.state.option.accurate = Accurate
channel-type.movavacuum.mopping-type-channel.state.option.deep = Deep
channel-type.movavacuum.low-lying-frequency-channel.label = Low-Lying Areas Frequency
channel-type.movavacuum.low-lying-frequency-channel.state.option.weekly = Low frequency
channel-type.movavacuum.low-lying-frequency-channel.state.option.daily = High frequency
channel-type.movavacuum.drying-time-channel.label = Drying Time
channel-type.movavacuum.drying-time-channel.description = Duration of mop drying (hours).
channel-type.movavacuum.drying-time-channel.state.option.1h = 1 h (dry weather)
channel-type.movavacuum.drying-time-channel.state.option.2h = 2 h (mild weather)
channel-type.movavacuum.drying-time-channel.state.option.3h = 3 h (rainy/coastal)
channel-type.movavacuum.drying-time-channel.state.option.4h = 4 h (cool/humid)
channel-type.movavacuum.charge-limit-channel.label = Charge Limit
channel-type.movavacuum.charge-limit-channel.description = Battery level up to which the robot charges (property 28/47, 80 to 100 percent).
channel-type.movavacuum.off-peak-time-channel.label = Off-Peak Time
channel-type.movavacuum.off-peak-time-channel.description = Time in format HH:mm for off-peak charging.
channel-type.movavacuum.rooms-channel.label = Rooms
channel-type.movavacuum.rooms-channel.description = Rooms of the map as list "number: name" (read only).
channel-type.movavacuum.map-refresh-channel.label = Refresh Map
channel-type.movavacuum.map-refresh-channel.description = ON reloads the map from the cloud immediately; the switch then returns to OFF.
channel-type.movavacuum.clean-rooms-channel.label = Clean Rooms
channel-type.movavacuum.clean-rooms-channel.description = Rooms separated by comma, number or name (e.g. 1,2 or Kitchen@times=2/suction=strong/water=3). Without options: current suction and water level, once. Option room uses the room settings stored in the app.
channel-type.movavacuum.clean-zone-channel.label = Clean Zones
channel-type.movavacuum.clean-zone-channel.description = Zones as x1,y1,x2,y2 in map units (mm), several separated by semicolon, optionally with options, e.g. -1000,-500,2000,1500@times=2/suction=strong/water=2. Without options: current suction and water level, once.
channel-type.movavacuum.cleaning-mode-channel.label = Cleaning Mode
channel-type.movavacuum.cleaning-mode-channel.description = Vacuum, mop, vacuum and mop, or mop after vacuum (value in 4/23, only the lowest 2 bits are changed).
channel-type.movavacuum.cleaning-mode-channel.state.option.sweeping = Vacuum
channel-type.movavacuum.cleaning-mode-channel.state.option.mopping = Mop
channel-type.movavacuum.cleaning-mode-channel.state.option.sweeping_and_mopping = Vacuum and mop
channel-type.movavacuum.cleaning-mode-channel.state.option.mopping_after_sweeping = Mop after vacuum
channel-type.movavacuum.water-level-channel.label = Mop Water Level
channel-type.movavacuum.water-level-channel.description = Water level when mopping (1 to 32, property 28/1).
channel-type.movavacuum.station-status-channel.label = Station Status
channel-type.movavacuum.station-status-channel.description = Status of the base station as text (read only).
channel-type.movavacuum.station-percent-channel.label = Station Percentage
channel-type.movavacuum.station-percent-channel.description = Percentage value of the base station (read only).
channel-type.movavacuum.station-flag-channel.label = Station Flag
channel-type.movavacuum.station-flag-channel.description = Yes/no status of the base station (read only).
channel-type.movavacuum.base-command-channel.label = Base Station Command
channel-type.movavacuum.base-command-channel.description = Command for the base station.
channel-type.movavacuum.base-command-channel.command.option.wash_mop = Wash mop
channel-type.movavacuum.base-command-channel.command.option.pause_wash = Pause washing
channel-type.movavacuum.base-command-channel.command.option.resume_wash = Resume washing
channel-type.movavacuum.base-command-channel.command.option.dry_mop = Dry mop
channel-type.movavacuum.base-command-channel.command.option.stop_dry_mop = Stop mop drying
channel-type.movavacuum.base-command-channel.command.option.dry_dust_bag = Dry dust bag
channel-type.movavacuum.base-command-channel.command.option.stop_dry_dust_bag = Stop dust bag drying
channel-type.movavacuum.base-command-channel.command.option.drain_dirty_water = Drain dirty water
channel-type.movavacuum.base-command-channel.command.option.empty_clean_tank = Empty clean water tank
channel-type.movavacuum.base-command-channel.command.option.empty_dust = Empty dust bin
channel-type.movavacuum.reset-consumable-channel.label = Reset Consumable
channel-type.movavacuum.reset-consumable-channel.description = Resets the counter after replacement: main_brush, side_brush, filter, sensor, wheel, scale_inhibitor, washboard.
channel-type.movavacuum.reset-consumable-channel.command.option.main_brush = Main brush
channel-type.movavacuum.reset-consumable-channel.command.option.side_brush = Side brush
channel-type.movavacuum.reset-consumable-channel.command.option.filter = Filter
channel-type.movavacuum.reset-consumable-channel.command.option.sensor = Sensors
channel-type.movavacuum.reset-consumable-channel.command.option.wheel = Wheels
channel-type.movavacuum.reset-consumable-channel.command.option.scale_inhibitor = Scale inhibitor
channel-type.movavacuum.reset-consumable-channel.command.option.washboard = Washboard cleaning
channel-type.movavacuum.cleangenius-channel.label = CleanGenius
channel-type.movavacuum.cleangenius-channel.description = AI controlled cleaning: off, routine_cleaning, deep_cleaning (only effective with mop pads attached).
channel-type.movavacuum.cleangenius-channel.state.option.off = Off
channel-type.movavacuum.cleangenius-channel.state.option.routine_cleaning = Routine cleaning
channel-type.movavacuum.cleangenius-channel.state.option.deep_cleaning = Deep cleaning
channel-type.movavacuum.cleangenius-mode-channel.label = CleanGenius Mode
channel-type.movavacuum.cleangenius-mode-channel.description = CleanGenius mode: vacuum_and_mop or mop_after_vacuum.
channel-type.movavacuum.cleangenius-mode-channel.state.option.vacuum_and_mop = Vacuum and mop
channel-type.movavacuum.cleangenius-mode-channel.state.option.mop_after_vacuum = Mop after vacuum
channel-type.movavacuum.room-settings-channel.label = Change Room Settings
channel-type.movavacuum.room-settings-channel.description = Write settings per room, e.g. "Kitchen@times=2/suction=strong/water=2/mode=sweeping_and_mopping/order=1, 9@times=1". Options: times 1-3, suction quiet/standard/strong/turbo, water 1-3, mode sweeping/mopping/sweeping_and_mopping, order = position in the cleaning sequence. Only while docked.
channel-type.movavacuum.error-text-channel.label = Error Text
channel-type.movavacuum.error-text-channel.description = Description of the current error code (read only).
channel-type.movavacuum.last-cleaning-channel.label = Last Cleaning
channel-type.movavacuum.last-cleaning-channel.description = One line about the last cleaning: start, duration, area, result (read only).
channel-type.movavacuum.cleaning-history-channel.label = Cleaning History
channel-type.movavacuum.cleaning-history-channel.description = The last 10 cleanings, one line per run, newest first (read only).
channel-type.movavacuum.clean-spot-channel.label = Clean Spots
channel-type.movavacuum.clean-spot-channel.description = Points as x,y in map units (mm), several separated by semicolon, optionally with options, e.g. 700,-1500@times=2/suction=quiet/water=2. About 1.5 m\u00b2 around the point are cleaned.
channel-type.movavacuum.room-zones-channel.label = Room Coordinates
channel-type.movavacuum.room-zones-channel.description = One line per room: bounding rectangle (zone x1,y1,x2,y2) and a safely reachable point near the room centre in map units (mm), read only. For use with zone and spot cleaning.
channel-type.movavacuum.robot-position-channel.label = Robot Position
channel-type.movavacuum.robot-position-channel.description = Position of the robot (x,y in mm) with room, station and timestamp of the last map (read only). During cleaning and return the map is reloaded every minute.
channel-type.movavacuum.go-to-channel.label = Go To Point
channel-type.movavacuum.go-to-channel.description = Target point as x,y in map units (mm). The robot drives there and stays (only on models with camera).
channel-type.movavacuum.remote-control-channel.label = Remote Control
channel-type.movavacuum.remote-control-channel.description = One step: forward, backward, left, right, stop or rotation,velocity (rotation -360..360, velocity -600..600).
channel-type.movavacuum.shortcuts-channel.label = Shortcuts
channel-type.movavacuum.shortcuts-channel.description = One line per shortcut: number, name and "running" if active (read only).
channel-type.movavacuum.shortcut-channel.label = Shortcut Command
channel-type.movavacuum.shortcut-channel.description = start:number or name (without prefix the shortcut is started), rename:number=new name or delete:number.
channel-type.movavacuum.room-edit-channel.label = Edit Rooms
channel-type.movavacuum.room-edit-channel.description = Room@option, several rooms separated by semicolon, options separated by slash: name=new name, visible=on|off, floor=none|wood|tile, mop=A|B|C. Example: Utility@name=Utility room/floor=tile. Not during cleaning.
channel-type.movavacuum.map-command-channel.label = Map Command
channel-type.movavacuum.map-command-channel.description = rename:new name (rename the current map) or backup (back up the current map in the cloud). Not during cleaning.
channel-type.movavacuum.room-progress-channel.label = Room Progress
channel-type.movavacuum.room-progress-channel.description = Finished, skipped and pending rooms of the running job (read only).
channel-type.movavacuum.current-room-channel.label = Current Room
channel-type.movavacuum.current-room-channel.description = Room the robot is in according to the last map (read only).
channel-type.movavacuum.obstacles-channel.label = Detected Obstacles
channel-type.movavacuum.obstacles-channel.description = One line per obstacle: number, type, position (mm), ignored if applicable (read only).
channel-type.movavacuum.obstacle-ignore-channel.label = Ignore Obstacle
channel-type.movavacuum.obstacle-ignore-channel.description = number=ignore or number=restore (number from the Detected Obstacles channel). Not during cleaning.
channel-type.movavacuum.room-info-channel.label = Room Settings
channel-type.movavacuum.room-info-channel.description = One line per room: mode, suction, water, repeats, order, last cleaning (read only).
channel-type.movavacuum.map-image-channel.label = Map
channel-type.movavacuum.map-image-channel.description = Rendered map as PNG in the light theme (app style, transparent background).
channel-type.movavacuum.map-image-dark-channel.label = Map (dark)
channel-type.movavacuum.map-image-dark-channel.description = Rendered map as PNG in the dark theme. Only rendered if an item is linked.
